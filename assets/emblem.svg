<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="JPN Sarvodaya Vidyalaya Emblem">
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#1a3068" stroke-width="3"/>
  <!-- Inner circle -->
  <circle cx="60" cy="60" r="48" fill="#1a3068"/>
  <!-- Gold decorative ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#c89a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Ashoka Chakra-inspired spokes -->
  <g transform="translate(60,60)" fill="none" stroke="#c89a1a" stroke-width="1">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(22.5)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(45)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(67.5)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(90)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(112.5)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(135)"/>
    <line x1="0" y1="-22" x2="0" y2="22" transform="rotate(157.5)"/>
    <circle cx="0" cy="0" r="22" stroke="#c89a1a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" stroke="#c89a1a" fill="none"/>
    <circle cx="0" cy="0" r="3" fill="#c89a1a"/>
  </g>
  <!-- Book icon above centre -->
  <rect x="49" y="36" width="22" height="17" rx="2" fill="#e8831f" opacity="0.9"/>
  <line x1="60" y1="36" x2="60" y2="53" stroke="white" stroke-width="1.5"/>
  <!-- Torch / flame -->
  <ellipse cx="60" cy="32" rx="4" ry="6" fill="#f0c84a" opacity="0.95"/>
  <ellipse cx="60" cy="35" rx="2.5" ry="4" fill="#e8831f"/>
  <!-- Text: JPN (top arc placeholder — use text path) -->
  <text
    x="60" y="82"
    text-anchor="middle"
    font-family="Poppins, sans-serif"
    font-size="7.5"
    font-weight="700"
    fill="white"
    letter-spacing="0.5">JPN SARVODAYA</text>
  <text
    x="60" y="93"
    text-anchor="middle"
    font-family="Poppins, sans-serif"
    font-size="6"
    font-weight="600"
    fill="#f0c84a"
    letter-spacing="0.3">VIDYALAYA</text>
  <!-- Bottom: BAREILLY -->
  <text
    x="60" y="104"
    text-anchor="middle"
    font-family="Poppins, sans-serif"
    font-size="5.5"
    fill="rgba(255,255,255,0.65)"
    letter-spacing="0.5">BAREILLY • U.P.</text>
</svg>
